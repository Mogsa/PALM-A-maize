[project]
name = "paperboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pymupdf==1.28.2",
    "pymupdf4llm==1.28.2",
    "pymupdf-layout==1.28.2",
    "pydantic>=2.9",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
paperboard = "paperboard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
